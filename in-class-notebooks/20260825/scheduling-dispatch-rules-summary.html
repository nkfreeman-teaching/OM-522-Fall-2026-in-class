      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

E\n\u003Cspan class=\"pill\"\u003Edue dates 10\u201338\u003C/span\u003E\n\u003Cspan class=\"pill\"\u003Eall jobs available at time 0\u003C/span\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe model one continuously available machine, non-preemptive processing, zero setup time, and no\ninserted idle time. Because all jobs are ready at time zero, \u003Cstrong\u003Eflow time equals completion time\u003C/strong\u003E.\nPriority \u003Ccode\u003E1\u003C/code\u003E is interpreted as highest and \u003Ccode\u003E3\u003C/code\u003E as lowest; for weighted measures this becomes\nweight \u003Ccode\u003E3\u003C/code\u003E, \u003Ccode\u003E2\u003C/code\u003E, and \u003Ccode\u003E1\u003C/code\u003E, respectively.\u003C/span\u003E\n\u003Cdiv class=\"note\"\u003E\u003Cstrong\u003EImportant:\u003C/strong\u003E every rule has the same makespan (168).\nSequencing changes when jobs finish\u2014not the total workload\u2014so makespan cannot distinguish these rules.\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f36644987f15b7763a98f5b19afd2730", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "60c25229c96b1e8f18be99dd5a9a700b", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"rules-compared\"\u003ERules compared\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EStatic rules sort once; \u003Cstrong\u003ECR, MS, and ATC are recalculated after every completion\u003C/strong\u003E.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='PKri-0' random-id='73886a51-3e47-549b-ce67-a22023334079'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;Rule\u0026#92;\u0026quot;:\u0026#92;\u0026quot;FCFS\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Full name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;First Come, First Served\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Decision logic\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Original file order\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Typical objective\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Simplicity / perceived fairness\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Rule\u0026#92;\u0026quot;:\u0026#92;\u0026quot;SPT\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Full name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Shortest Processing Time\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Decision logic\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Smallest processing time\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Typical objective\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Mean flow time and WIP\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Rule\u0026#92;\u0026quot;:\u0026#92;\u0026quot;LPT\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Full name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Longest Processing Time\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Decision logic\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Largest processing time\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Typical objective\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Stress-test benchmark\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Rule\u0026#92;\u0026quot;:\u0026#92;\u0026quot;EDD\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Full name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Earliest Due Date\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Decision logic\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Smallest due date\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Typical objective\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Maximum lateness\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Rule\u0026#92;\u0026quot;:\u0026#92;\u0026quot;CR\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Full name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Critical Ratio\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Decision logic\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Smallest (due \u0026#92;\u0026#92;u2212 now) / processing\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Typical objective\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Dynamic due-date urgency\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Rule\u0026#92;\u0026quot;:\u0026#92;\u0026quot;MS\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Full name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Minimum Slack\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Decision logic\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Smallest due \u0026#92;\u0026#92;u2212 now \u0026#92;\u0026#92;u2212 processing\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Typical objective\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Dynamic due-date urgency\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Rule\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Priority\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Full name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Priority then EDD\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Decision logic\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Smallest priority class, then due date\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Typical objective\u0026#92;\u0026quot;:\u0026#92;\u0026quot;High-priority service\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Rule\u0026#92;\u0026quot;:\u0026#92;\u0026quot;WSPT\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Full name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Weighted Shortest Processing Time\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Decision logic\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Smallest processing / priority weight\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Typical objective\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Weighted mean flow time\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Rule\u0026#92;\u0026quot;:\u0026#92;\u0026quot;ATC\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Full name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Apparent Tardiness Cost\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Decision logic\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Largest urgency index combining weight, processing time, and slack\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Typical objective\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Weighted tardiness compromise\u0026#92;\u0026quot;}]\u0026quot;' data-total-rows='9' data-total-columns='4' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-field-types='[[\u0026quot;Rule\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;Full name\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;Decision logic\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]],[\u0026quot;Typical objective\u0026quot;,[\u0026quot;string\u0026quot;,\u0026quot;str\u0026quot;]]]' data-show-filters='true' data-show-download='true' data-show-search='true' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='true' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "27a7ab43c80ad2f48c1bff6553e9fd97", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7b4dbdee0cf3a36c6c286808bfb0c551", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "50ff078eb18090a493d4908e3d478dcd", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"headline-findings\"\u003EHeadline findings\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe balanced score ranks \u003Cstrong\u003ESPT first\u003C/strong\u003E (87.9/100). No single policy\nowns every objective, which is the central scheduling lesson:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003ESPT\u003C/strong\u003E minimizes average flow time (69.2) and therefore average WIP (12.4 jobs).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003ESPT\u003C/strong\u003E minimizes total tardiness (1420 time units).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EATC\u003C/strong\u003E best protects priority-weighted due-date performance (3324).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EEDD\u003C/strong\u003E achieves the minimum worst lateness (130); SPT, EDD, MS, CR tie on this instance. EDD is the rule with the general single-machine maximum-lateness guarantee.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EThe composite is a decision aid, not a theorem. It uses 25% each for average flow, total tardiness,\nand weighted tardiness; 15% for maximum tardiness; and 10% for tardy-job count. Change those weights\nwhen the operating objective changes.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "39d18f1b50f6f94da69a6b5105a81794", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='RGSE-0' random-id='afe32d65-4564-89c6-835a-a7d15c332b32'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;Overall_Rank\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;Rule\u0026#92;\u0026quot;:\u0026#92;\u0026quot;SPT\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Score / 100\u0026#92;\u0026quot;:87.9,\u0026#92;\u0026quot;Avg flow\u0026#92;\u0026quot;:69.2,\u0026#92;\u0026quot;Avg WIP\u0026#92;\u0026quot;:12.4,\u0026#92;\u0026quot;Tardy jobs\u0026#92;\u0026quot;:25,\u0026#92;\u0026quot;On-time %\u0026#92;\u0026quot;:16.7,\u0026#92;\u0026quot;Total tardiness\u0026#92;\u0026quot;:1420,\u0026#92;\u0026quot;Max tardiness\u0026#92;\u0026quot;:130,\u0026#92;\u0026quot;Weighted tardiness\u0026#92;\u0026quot;:3581},{\u0026#92;\u0026quot;Overall_Rank\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;Rule\u0026#92; ert contents\"\u003E\u003Ch2 id=\"what-to-use-in-practice\"\u003EWhat to use in practice\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EUse \u003Cstrong\u003ESPT\u003C/strong\u003E when fast throughput, low average flow time, and low WIP dominate. It can postpone long jobs.\u003C/li\u003E\n\u003Cli\u003EUse \u003Cstrong\u003EEDD\u003C/strong\u003E when controlling the single worst lateness is the contractual objective. It does not explicitly minimize total tardiness.\u003C/li\u003E\n\u003Cli\u003EUse \u003Cstrong\u003EWSPT\u003C/strong\u003E when priority-weighted completion time matters; it balances short work with important work.\u003C/li\u003E\n\u003Cli\u003EUse \u003Cstrong\u003EATC\u003C/strong\u003E when weighted tardiness is the operational concern. Its urgency changes as the clock advances.\u003C/li\u003E\n\u003Cli\u003EUse \u003Cstrong\u003ECR or minimum slack\u003C/strong\u003E for a transparent dynamic due-date signal, but monitor instability when many jobs become overdue.\u003C/li\u003E\n\u003Cli\u003EKeep \u003Cstrong\u003EFCFS\u003C/strong\u003E when simplicity and arrival-order fairness outweigh measurable performance gains.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3 id=\"limits-and-next-experiment\"\u003ELimits and next experiment\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EThese conclusions are specific to one deterministic, single-machine job set. Release dates, uncertain\nprocessing times, sequence-dependent product changeovers, machine downtime, and precedence constraints\ncan change the ranking. The most valuable extension would add a product-change setup matrix and compare\nthese policies over many randomly generated demand scenarios, reporting confidence intervals rather than\none-instance point estimates.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.24.0", "script_metadata_hash": null}, "version": "1"},
